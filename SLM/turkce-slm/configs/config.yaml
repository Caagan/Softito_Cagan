model_name: turkce-slm
description: Turkce kucuk dil modeli (MiniGPT)

data:
  source: turkish-wikipedia
  block_size: 128
  min_freq: 2

model:
  vocab_size: 5000
  embed_dim: 128
  num_heads: 4
  num_layers: 4
  ff_dim: 512
  max_len: 128
  dropout: 0.1

training:
  batch_size: 32
  epochs: 50
  lr: 0.0003
  weight_decay: 0.01
  max_grad_norm: 1.0
  device: auto

generate:
  temperature: 0.8
  max_new_tokens: 100
  top_k: 50
